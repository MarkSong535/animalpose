  behavior_top_k: 3
  behavior_smooth: 3
  behavior_prior_adapt: true
  behavior_prior_max_ratio: 4.0
  embedder: model
  temporal_window: 16
  batch_crops: 8
tracker:
  high_thresh: 0.0
  low_thresh: 0.0
  max_animals: 2
  max_lost: 5
  n_init: 1

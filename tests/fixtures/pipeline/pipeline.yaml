device: cpu
checkpoints:
  detector: tests/fixtures/pipeline/detector.safetensors
  pose: tests/fixtures/pipeline/pose.safetensors
  temporal: tests/fixtures/pipeline/temporal.safetensors
  behavior: tests/fixtures/pipeline/behavior.safetensors
pipeline:
  det_size:
  - 96
  - 96
  det_thresh: 0.0
  max_det: 3
  crop_size: 64

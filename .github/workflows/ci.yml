name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url "$TORCH_INDEX"
          pip install -e ".[dev]" safetensors ruff==0.17.3
      - uses: ./.github/actions/setup-ffmpeg
      - name: Lint
        run: ruff check src tests scripts/package_release.py
      - name: Test with coverage
        run: bash scripts/coverage.sh
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: MarkSong535/animalpose
          fail_ci_if_error: false

  python-platform:
    name: python import + fast tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url ${{ env.TORCH_INDEX }}
          pip install -e ".[dev]"
      - uses: ./.github/actions/setup-ffmpeg
      - name: Test (skips the slow marker)
        run: pytest -q -m "not slow"

  rust:
    name: rust (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        working-directory: rust
    env:
      # rust-toolchain.toml pins a channel; CI deliberately overrides it with
      # `stable` so a runner image without the pinned version still builds.
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-22.04
          - name: linux-aarch64
            runs-on: ubuntu-24.04-arm
          - name: windows-x86_64
            runs-on: windows-latest
          - name: macos-aarch64
            runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup-ffmpeg
      - name: Install Rust toolchain
        run: rustup toolchain install stable --component rustfmt --component clippy
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version
      - name: Cache cargo
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: rust/target/
          key: cargo-${{ matrix.name }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.name }}-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  rust-gui-macos:
    name: rust (macOS, GPU + GUI features)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup-ffmpeg
      - name: Install Rust toolchain
        run: rustup toolchain install stable --component clippy
      - name: Clippy (mps, gui)
        run: |
          cargo clippy --all-targets --features mps -- -D warnings
          cargo clippy --all-targets --features gui -- -D warnings
      - name: Test (gui, which includes mps)
        run: cargo test --release --features gui
      - name: Clippy and test the native app's C interface (ffi)
        run: |
          cargo clippy --all-targets --features ffi -- -D warnings
          cargo test --release --features ffi ffi::
      - name: Build the SwiftUI app
        working-directory: macos
        run: ./build-app.sh

  # Line coverage of the crate, reported to Codecov next to the python flag. `cargo-llvm-cov`
  # instruments the test binaries, so this runs the whole workspace suite once and writes the
  # Codecov JSON in the same pass.
  rust-coverage:
    name: rust coverage
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup-ffmpeg
      - name: Install Rust toolchain
        run: rustup toolchain install stable --component llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: rust/target/
          key: cargo-llvm-cov-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-llvm-cov-
      - name: Test with coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --all-targets \
            --codecov --output-path coverage/codecov.json
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: rust/coverage/codecov.json
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: MarkSong535/animalpose
          fail_ci_if_error: false

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url "$TORCH_INDEX"
          pip install -e ".[dev]" ruff==0.17.3
      - name: Lint
        run: ruff check src tests
      - name: Test with coverage
        run: bash scripts/coverage.sh
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  python-platform:
    name: python import + fast tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url ${{ env.TORCH_INDEX }}
          pip install -e ".[dev]"
      - name: Test (skips the slow marker)
        run: pytest -q -m "not slow"

  rust:
    name: rust (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        working-directory: rust
    env:
      # rust-toolchain.toml pins a channel; CI deliberately overrides it with
      # `stable` so a runner image without the pinned version still builds.
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-22.04
          - name: linux-aarch64
            runs-on: ubuntu-24.04-arm
          - name: windows-x86_64
            runs-on: windows-latest
          - name: macos-x86_64
            runs-on: macos-13
          - name: macos-aarch64
            runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --component rustfmt --component clippy
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version
      - name: Cache cargo
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: rust/target/
          key: cargo-${{ matrix.name }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.name }}-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  rust-gui-macos:
    name: rust (macOS, GPU + GUI features)
    runs-on: macos-14
    defaults:
      run:
        working-directory: rust
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --component clippy
      - name: Clippy (mps, gui)
        run: |
          cargo clippy --all-targets --features mps -- -D warnings
          cargo clippy --all-targets --features gui -- -D warnings
      - name: Test (gui, which includes mps)
        run: cargo test --release --features gui

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify package metadata and tag
        id: version
        shell: bash
        run: |
          version=$(python3 scripts/package_release.py version)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Expected tag v$version, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  native:
    name: Native packages (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-22.04
          - target: linux-aarch64
            os: ubuntu-22.04-arm
          - target: macos-aarch64
            os: macos-15
          - target: windows-x86_64
            os: windows-2022
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: ./.github/actions/setup-ffmpeg
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev file nasm rpm xvfb xauth libgl1-mesa-dri
      - name: Install the JPEG assembler (Windows)
        if: runner.os == 'Windows'
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "$env:ProgramFiles\NASM" >> $env:GITHUB_PATH
          }
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test and compile the headless and desktop binaries
        working-directory: rust
        shell: bash
        run: |
          cargo test --locked --release --features gui
          cargo build --locked --release --features gui --bin animalpose-gui
          cargo build --locked --release --no-default-features --bin animalpose
      - name: Package the executables
        run: python scripts/package_release.py native --out dist/native
      - name: Test an installed Linux package and launch the desktop app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y ./dist/native/*.deb
          animalpose --version
          status=0
          timeout 10s xvfb-run -a animalpose-gui || status=$?
          test "$status" -eq 124
      - name: Test RPM installation on Fedora
        if: runner.os == 'Linux'
        run: |
          # A clean system without the checkout: prediction must run on the general models the
          # desktop package ships. FFmpeg with libx264 comes from RPM Fusion, as users install it.
          docker run --rm -v "$PWD/dist/native:/packages:ro" fedora:44 bash -ec '
            dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm
            dnf install -y --allowerasing /packages/*.rpm ffmpeg
            animalpose --version
            test -x /usr/bin/animalpose-gui
            cd "$(mktemp -d)"
            animalpose predict --synthetic --max-frames 2 --out result
            test -s result/tracks.csv
            test -s result/overlay.mp4
          '
      - name: Verify prediction with the packaged models
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          EXE_SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          smoke=$(mktemp -d)
          python scripts/package_release.py models --out "$smoke"
          python -m zipfile -e "$smoke/animalpose-models-v$VERSION.zip" "$smoke"
          cp "rust/target/release/animalpose$EXE_SUFFIX" "$smoke/"
          cd "$smoke"
          mkdir work
          cd work
          "../animalpose$EXE_SUFFIX" predict --synthetic --max-frames 2 --out result
          test -s result/tracks.csv
          test -s result/overlay.mp4
      - uses: actions/upload-artifact@v7
        with:
          name: animalpose-${{ matrix.target }}
          path: dist/native/*
          if-no-files-found: error

  python:
    name: Python wheel and source distribution
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      # The package is pure Python: one py3-none-any wheel installs on every OS and CPU, and
      # python-test below proves that on each platform before anything is published.
      - name: Build and verify Python distributions
        run: |
          python -m pip install build twine
          python -m build --outdir dist/python
          python -m twine check --strict dist/python/*
          ls dist/python/animalpose-*-py3-none-any.whl dist/python/animalpose-*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: animalpose-python
          path: dist/python/*
          if-no-files-found: error

  python-test:
    name: Python wheel on ${{ matrix.platform }} (Python ${{ matrix.python }})
    needs: python
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, os: ubuntu-24.04, python: '3.10'}
          - {platform: linux-x86_64, os: ubuntu-24.04, python: '3.13'}
          - {platform: linux-aarch64, os: ubuntu-24.04-arm, python: '3.13'}
          - {platform: macos-aarch64, os: macos-15, python: '3.10'}
          - {platform: macos-aarch64, os: macos-15, python: '3.13'}
          - {platform: windows-x86_64, os: windows-2022, python: '3.10'}
          - {platform: windows-x86_64, os: windows-2022, python: '3.13'}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/download-artifact@v8
        with:
          name: animalpose-python
          path: dist/python
      - name: Install the CPU build of PyTorch (Linux; the default one bundles CUDA)
        if: runner.os == 'Linux'
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install the wheel and predict with the general models
        shell: bash
        run: |
          python -m pip install dist/python/animalpose-*-py3-none-any.whl
          work="$RUNNER_TEMP/wheel-smoke"
          mkdir -p "$work"
          cp -R configs weights "$work/"
          cd "$work"  # away from the checkout, so src/ cannot stand in for the installed wheel
          python -c 'import animalpose, pathlib; f = pathlib.Path(animalpose.__file__); print(f); assert "site-packages" in f.parts'
          python -c 'from importlib.resources import files; assert files("animalpose.behavior").joinpath("behaviors.json").is_file()'
          animalpose --help
          animalpose predict --synthetic --max-frames 2 --out result
          test -s result/tracks.csv
          test -s result/overlay.mp4

  models:
    name: Shared models, configs and license
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - run: |
          python3 scripts/package_release.py models --out dist/models
          cp LICENSE dist/models/
      - uses: actions/upload-artifact@v7
        with:
          name: animalpose-models
          path: dist/models/*
          if-no-files-found: error

  publish:
    name: Verify assets and publish tagged release
    needs: [version, native, python, python-test, models]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: animalpose-*
          merge-multiple: true
          path: release-assets
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-checksums
          path: release-assets/SHA256SUMS
          if-no-files-found: error
      - name: Publish this tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            gh release create "$TAG" --verify-tag --draft --generate-notes
            draft=true
          fi
          if [[ "$draft" == true ]]; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --draft=false
          fi

  pypi:
    name: Publish to PyPI
    # After the GitHub release, so a failed build or test never reaches PyPI (an upload is permanent).
    needs: [version, publish]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # Trusted publishing: no token. On pypi.org the project's publisher is this repository,
    # workflow release.yml and environment pypi.
    environment:
      name: pypi
      url: https://pypi.org/project/animalpose/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: animalpose-python
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # a rerun after a partial upload finishes the rest

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animalpose"
version = "1.0.0"
description = "Species-agnostic multi-animal pose estimation, tracking, behavior and multi-view 3D for rodents and beyond"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  # NumPy 2 only; each minimum below is the first release built for it.
  "torch>=2.3",
  "torchvision>=0.18",  # the general pose model is a ResNet-18
  "numpy>=2.0",
  "scipy>=1.13",
  "opencv-python-headless>=4.10",
  "pyyaml>=6.0",
]

[project.scripts]
animalpose = "animalpose.cli:main"

[project.optional-dependencies]
behavior = ["scikit-learn>=1.4.2"]  # `animalpose behavior cluster`
plot = ["matplotlib>=3.9"]  # `animalpose behavior plot`
export = ["onnx>=1.17", "onnxruntime>=1.19", "onnxscript>=0.1"]
real = ["pandas>=2.2.2", "tables>=3.10"]  # real-dataset converters and DeepLabCut .h5 tracks
# Base test dependencies. The coverage job also installs safetensors.
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "onnx>=1.17",
  "onnxruntime>=1.19",
  "onnxscript>=0.1",
  "pandas>=2.2.2",
  "tables>=3.10",
  "scikit-learn>=1.4.2",
  "matplotlib>=3.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
animalpose = ["behavior/behaviors.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end tests that train small models (seconds to a minute on CPU)"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E731", "B023", "B905"]

# Coverage measures the library: the `eval` report commands print tables over the downloaded
# datasets (14 GB, cluster-only) and are plumbing over src/animalpose/eval, so they are omitted.
[tool.coverage.run]
source = ["src/animalpose"]
omit = ["*/cli/evaluate/*"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true
fail_under = 99
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "^\\s*raise NotImplementedError\\b",
]

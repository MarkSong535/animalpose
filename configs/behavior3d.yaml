# Frame-wise behavior classifier on triangulated 3D pose sequences.
device: auto
output: runs/behavior3d.pt
model:
  num_keypoints: 25
  dims: 3
  hidden: 96
  classes: [resting, walking, rearing, grooming, eating]
data: {window: 96, species: [mouse, rat]}
train: {steps: 3000, batch_size: 32, lr: 2.0e-3, workers: 2, log_every: 100}
